{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Chấm công Khuôn mặt</title>
    <link rel="stylesheet" href="{% static 'attendance/css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>HỆ THỐNG CHẤM CÔNG KHUÔN MẶT</h1>
            <p class="subtitle">Đăng nhập vào hệ thống</p>

            {% if error %}
                <div class="alert alert-error">
                    <span class="alert-icon">✕</span>
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success">
                    <span class="alert-icon">✓</span>
                    {{ success }}
                </div>
            {% endif %}

            <form method="POST" class="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>

        </div>

        <div class="footer">
            <p>&copy; 2024 Face Attendance System | DATN</p>
        </div>
    </div>
</body>
</html>
